[tool.poetry]
name = "searchtweets"
version = "1.7.7"
description = "Wrapper for Twitter's Premium and Enterprise search APIs"
authors = ["Fiona Pigott, Jeff Kolb, Josh Montague, Aaron Gonzales <agonzales@twitter.com>"]
license = "MIT"
readme = "README.rst"
homepage = "https://github.com/twitterdev/search-tweets-python"
repository = "https://github.com/twitterdev/search-tweets-python"
packages = [{include = "searchtweets"}]

[tool.poetry.dependencies]
python = "^3.8"
requests = "*"
tweet-parser = "*"
pyyaml = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"

[tool.poetry.scripts]
search_tweets = "tools.search_tweets:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=searchtweets",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-vv"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests"
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning"
]

[tool.coverage.run]
source = ["searchtweets"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
    "*/venv/*",
    "*/env/*",
    "*/conftest.py",
    "*/setup.py"
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"